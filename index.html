<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>netwatch — wifi activity</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #d8dee4;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Mono", Menlo, Consolas, monospace; }
  header { position: sticky; top: 0; z-index: 5; background: #11151a; border-bottom: 1px solid #1e242c;
    padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .03em; color: #e8eef5; }
  header .stats { display: flex; gap: 14px; color: #8a96a3; font-size: 12px; }
  header .stats b { color: #d8dee4; font-weight: 500; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #f44; display: inline-block; }
  header .dot.live { background: #4ade80; box-shadow: 0 0 8px #4ade8088; }
  header .pill { padding: 2px 8px; background: #1a2129; border: 1px solid #2a323b; border-radius: 10px; }
  header input { background: #0b0d10; color: #d8dee4; border: 1px solid #2a323b; border-radius: 4px;
    padding: 4px 8px; font: inherit; min-width: 200px; }
  main { padding: 12px 16px 60px; display: grid; gap: 14px; grid-template-columns: 1fr; }
  .panel { background: #11151a; border: 1px solid #1e242c; border-radius: 6px; overflow: hidden; }
  .panel h2 { margin: 0; padding: 9px 12px; background: #161b22; border-bottom: 1px solid #1e242c;
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8a96a3;
    display: flex; justify-content: space-between; align-items: center; }
  .panel h2 span { color: #5a6675; font-weight: 400; text-transform: none; letter-spacing: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid #161b22; }
  th { color: #5a6675; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    position: sticky; top: 0; background: #11151a; }
  tr:hover td { background: #161b22; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.host, .host { color: #8ab4f8; }
  .k { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px;
    text-transform: uppercase; letter-spacing: .04em; }
  .k.dns  { background: #0d2e4a; color: #8ab4f8; }
  .k.tls  { background: #0d4a2a; color: #6ee7a8; }
  .k.mdns { background: #4a0d3d; color: #f0a8d8; }
  .k.tls  { background: #0d4a2a; color: #6ee7a8; }
  .ev-time { color: #5a6675; font-variant-numeric: tabular-nums; }
  .empty { color: #5a6675; padding: 20px; text-align: center; }
  .bar { background: #0b0d10; border-radius: 2px; height: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4ade80, #8ab4f8); }
  .cols { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .scroll { max-height: 360px; overflow: auto; }
  .scroll-lg { max-height: 540px; overflow: auto; }
  a.host { color: #8ab4f8; text-decoration: none; }
  a.host:hover { text-decoration: underline; }
  .foot { color: #5a6675; font-size: 11px; padding: 8px 12px; border-top: 1px solid #1e242c;
    background: #0e1216; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header>
  <h1>netwatch</h1>
  <span class="dot" id="dot"></span>
  <span class="stats">
    <span class="pill">iface <b id="iface">—</b></span>
    <span class="pill">packets <b id="packets">0</b></span>
    <span class="pill">domains <b id="ndomains">0</b></span>
    <span class="pill">devices <b id="ndevices">0</b></span>
    <span class="pill">updated <b id="updated">never</b></span>
  </span>
  <input id="q" placeholder="filter host / device / kind…">
</header>
<main>
  <div class="cols">
    <section class="panel">
      <h2>Live events <span id="ev-count">0</span></h2>
      <div class="scroll-lg" id="events">
        <div class="empty">waiting for packets…</div>
      </div>
    </section>
    <section class="panel">
      <h2>Top domains <span id="top-count">0</span></h2>
      <div class="scroll" id="top">
        <div class="empty">—</div>
      </div>
    </section>
  </div>
  <div class="cols">
    <section class="panel">
      <h2>Devices on this wifi</h2>
      <div class="scroll" id="devices">
        <div class="empty">—</div>
      </div>
    </section>
    <section class="panel">
      <h2>Per-domain detail</h2>
      <div class="scroll" id="detail">
        <div class="empty">click a domain to see devices + kinds</div>
      </div>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmtAgo = (t) => {
  if (!t) return "—";
  const d = Date.now()/1000 - t;
  if (d < 5) return "now";
  if (d < 60) return d.toFixed(0)+"s ago";
  if (d < 3600) return (d/60).toFixed(0)+"m ago";
  return (d/3600).toFixed(1)+"h ago";
};
const fmtTime = (t) => {
  if (!t) return "—";
  const d = new Date(t*1000);
  return d.toTimeString().slice(0,8);
};
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let state = null;
let filter = "";
let lastEventsKey = "";
let ev = [];

async function pull() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) return;
    state = await r.json();
  } catch (e) { return; }
  render();
}

function passesFilter(s) {
  if (!filter) return true;
  const q = filter.toLowerCase();
  return s.toLowerCase().includes(q);
}

function render() {
  if (!state || state.empty) {
    $("#dot").classList.remove("live");
    return;
  }
  $("#dot").classList.add("live");
  $("#iface").textContent = state.iface || "—";
  $("#packets").textContent = state.packets || 0;
  $("#ndomains").textContent = Object.keys(state.domains || {}).length;
  $("#ndevices").textContent = Object.keys(state.devices || {}).length;
  $("#updated").textContent = fmtAgo(state.updated);

  ev = state.events || [];
  const evFiltered = ev.filter(e => passesFilter(e.host) || passesFilter(e.dev) || passesFilter(e.kind));
  $("#ev-count").textContent = evFiltered.length + " / " + ev.length;
  const ek = evFiltered.length + "|" + evFiltered.slice(-3).map(e=>e.host+"@"+e.t).join(",");
  if (ek !== lastEventsKey) {
    lastEventsKey = ek;
    const rows = evFiltered.slice().reverse().map(e => {
      const tt = e.t ? new Date(e.t*1000).toTimeString().slice(0,8) : "—";
      return `<tr><td class="ev-time">${tt}</td><td><span class="k ${e.kind}">${e.kind}</span></td>`+
             `<td class="host">${esc(e.host)}</td><td>${esc(e.dev)}</td></tr>`;
    }).join("");
    $("#events").innerHTML = rows || `<div class="empty">no events match</div>`;
  }

  const doms = Object.entries(state.domains || {})
    .filter(([k]) => passesFilter(k))
    .sort((a,b) => b[1].count - a[1].count)
    .slice(0, 80);
  const maxC = doms.length ? doms[0][1].count : 1;
  $("#top-count").textContent = doms.length;
  $("#top").innerHTML = doms.length === 0
    ? `<div class="empty">no domains</div>`
    : `<table><thead><tr><th>domain</th><th class="num">count</th><th>last</th><th>kinds</th><th></th></tr></thead><tbody>`+
        doms.map(([k,v]) => {
          const w = Math.round(100 * v.count / maxC);
          const kinds = Object.entries(v.kinds).map(([kk,n])=>`<span class="k ${kk}">${kk}:${n}</span>`).join(" ");
          return `<tr data-host="${esc(k)}" class="row-dom"><td class="host">${esc(k)}</td>`+
                 `<td class="num">${v.count}</td>`+
                 `<td class="ev-time">${fmtAgo(v.last)}</td>`+
                 `<td>${kinds}</td>`+
                 `<td><div class="bar"><i style="width:${w}%"></i></div></td></tr>`;
        }).join("") + `</tbody></table>`;

  const devs = Object.entries(state.devices || {})
    .filter(([k]) => passesFilter(k))
    .sort((a,b) => b[1].count - a[1].count);
  $("#devices").innerHTML = devs.length === 0
    ? `<div class="empty">no devices</div>`
    : `<table><thead><tr><th>device (ip)</th><th class="num">events</th><th class="num">hosts</th><th>last</th></tr></thead><tbody>`+
        devs.map(([k,v]) =>
          `<tr><td>${esc(k)}</td><td class="num">${v.count}</td><td class="num">${v.n_domains}</td>`+
          `<td class="ev-time">${fmtAgo(v.last)}</td></tr>`).join("") + `</tbody></table>`;
}

$("#q").addEventListener("input", e => { filter = e.target.value.trim(); render(); });

document.addEventListener("click", e => {
  const tr = e.target.closest("tr.row-dom");
  if (!tr || !state) return;
  const host = tr.dataset.host;
  const d = state.domains[host];
  if (!d) return;
  const kinds = Object.entries(d.kinds).map(([k,n])=>`<span class="k ${k}">${k}: ${n}</span>`).join(" ");
  const devs = Object.entries(d.devs).sort((a,b)=>b[1]-a[1])
    .map(([k,n])=>`<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join("");
  $("#detail").innerHTML =
    `<table><thead><tr><th colspan="2" class="host">${esc(host)}</th></tr></thead><tbody>`+
    `<tr><td>first seen</td><td class="ev-time">${fmtTime(d.first)} (${fmtAgo(d.first)})</td></tr>`+
    `<tr><td>last seen</td><td class="ev-time">${fmtTime(d.last)} (${fmtAgo(d.last)})</td></tr>`+
    `<tr><td>total</td><td class="num">${d.count}</td></tr>`+
    `<tr><td>kinds</td><td>${kinds}</td></tr>`+
    `<tr><th>device</th><th class="num">events</th></tr>`+
    devs + `</tbody></table>`;
});

pull();
setInterval(pull, 1500);
</script>
</body>
</html>
